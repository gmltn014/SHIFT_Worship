<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIFT 찬양팀</title>
  <style>
    /* CSS 변수: 테마 색상 설정 */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --sub-text: #64748b;
      --border-color: #e2e8f0;
      --nav-bg: #ffffff;
      --tab-bg: #f1f5f9;
      --tab-active-bg: #3b82f6;
      --tab-active-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --border-color: #334155;
      --nav-bg: #1e293b;
      --tab-bg: #334155;
      --tab-active-bg: #3b82f6;
      --tab-active-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 60px;
    }

    /* 상단 헤더 */
    header {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* 다크모드 토글 버튼 */
    .theme-toggle-btn {
      background-color: var(--tab-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 상단 탭 네비게이션 */
    .tab-container {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: nowrap;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background-color: var(--tab-bg);
      color: var(--text-color);
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--tab-active-bg);
      color: var(--tab-active-text);
      font-weight: 600;
    }

    /* 메인 컨텐츠 영역 */
    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .tab-content {
      display: none; /* 기본 숨김 */
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }

    .tab-content.active {
      display: block; /* 선택된 탭만 표시 */
    }

    .tab-content h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .tab-content p {
      color: var(--sub-text);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header>
    <div class="brand">SHIFT Worship</div>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">다크 모드</span>
    </button>
  </header>

  <!-- 탭 메뉴 (가로 스크롤 가능) -->
  <nav class="tab-container">
    <button class="tab-btn active" onclick="switchTab('conti', this)">이번 주 콘티</button>
    <button class="tab-btn" onclick="switchTab('archive', this)">아카이브</button>
    <button class="tab-btn" onclick="switchTab('notice', this)">공지사항</button>
    <button class="tab-btn" onclick="switchTab('members', this)">시프트 명단</button>
    <button class="tab-btn" onclick="switchTab('feedback', this)">익명의견함</button>
    <button class="tab-btn" onclick="switchTab('playground', this)">SHIFT 놀이터</button>
    <button class="tab-btn" onclick="switchTab('admin', this)">관리자</button>
  </nav>

  <!-- 각 탭 본문 영역 -->
  <main>
    <!-- 1. 이번 주 콘티 -->
    <section id="tab-conti" class="tab-content active">
      <h2>🎵 이번 주 콘티</h2>
      <p>이번 주 주일 예배 콘티 및 세션 라인업 영역입니다.</p>
    </section>

    <!-- 2. 아카이브 -->
    <section id="tab-archive" class="tab-content">
      <h2>📁 아카이브</h2>
      <p>지난 주차별 예배 콘티 및 실황 영상 기록 영역입니다.</p>
    </section>

    <!-- 3. 공지사항 -->
    <section id="tab-notice" class="tab-content">
      <h2>📢 공지사항</h2>
      <p>찬양팀 주요 알림 및 공지사항 영역입니다.</p>
    </section>

    <!-- 4. 시프트 명단 -->
    <section id="tab-members" class="tab-content">
      <h2>👥 시프트 명단</h2>
      <p>찬양팀 팀원 및 파트별 명단 안내 영역입니다.</p>
    </section>

    <!-- 5. 익명의견함 -->
    <section id="tab-feedback" class="tab-content">
      <h2>📮 익명의견함</h2>
      <p>팀원들의 자유로운 건의와 소통을 위한 익명 게시판 영역입니다.</p>
    </section>

    <!-- 6. SHIFT 놀이터 -->
    <section id="tab-playground" class="tab-content">
      <h2>🎮 SHIFT 놀이터</h2>
      <p>팀원 간 소통과 가벼운 즐길 거리를 위한 놀이터 영역입니다.</p>
    </section>

    <!-- 7. 관리자 -->
    <section id="tab-admin" class="tab-content">
      <h2>⚙️ 관리자 전용</h2>
      <p>라인업 배치 및 콘티 데이터 관리 영역입니다.</p>
    </section>
  </main>

  <script>
    // 1. 탭 전환 기능
    function switchTab(tabId, clickedBtn) {
      // 모든 본문 패널 숨기기
      const panels = document.querySelectorAll('.tab-content');
      panels.forEach(panel => panel.classList.remove('active'));

      // 모든 탭 버튼 비활성화
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      // 선택한 탭 및 버튼만 활성화
      const targetPanel = document.getElementById('tab-' + tabId);
      if (targetPanel) {
        targetPanel.classList.add('active');
      }
      clickedBtn.classList.add('active');
    }

    // 2. 라이트 / 다크 모드 (localStorage 연동)
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('shift_theme', theme);

      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');

      if (theme === 'dark') {
        themeIcon.innerText = '☀️';
        themeLabel.innerText = '라이트 모드';
      } else {
        themeIcon.innerText = '🌙';
        themeLabel.innerText = '다크 모드';
      }
    }

    function toggleTheme() {
      const currentTheme = localStorage.getItem('shift_theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(newTheme);
    }

    // 초기 테마 로드 (접속 시 이전 설정 불러오기)
    (function initTheme() {
      const savedTheme = localStorage.getItem('shift_theme') || 'light';
      applyTheme(savedTheme);
    })();
  </script>
</body>
</html>
